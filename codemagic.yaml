workflows:
  shellfish-ios-workflow:
    name: ShellFish Clone iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Set up
        script: |
          echo "Building ShellFishClone"
      - name: Build without signing for test
        script: |
          xcodebuild -project ShellFishClone.xcodeproj \
            -scheme ShellFishClone \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/ipa/*.ipa
      - build/*.app